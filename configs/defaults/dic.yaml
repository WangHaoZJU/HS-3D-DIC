# Default DIC parameters (tracked in git). Experiment files override any key.
# Values are initial settings, to be tuned by benchmarks B01/B03.
backend: auto            # auto | numpy | numba | cuda
poi:
  subset_size: 31        # px, odd
  step: 5                # px
interpolation:
  order: 5               # B-spline order: 3 | 5 (B01: quintic bias ~4x lower)
solver:
  max_iterations: 50
  convergence_threshold_px: 0.001
  min_gray_std: 1.0      # gray levels; subsets with lower std are LOW_TEXTURE
  max_condition: 1.0e+10 # scaled reference Hessian condition limit
stereo:
  shape_order: 2         # second-order: perspective difference and curvature between views
  initialization: sift_affine
  reliability_guided: true
  max_znssd: 0.4         # HIGH_RESIDUAL above this (ZNSSD = 2 (1 - ZNCC))
  max_reprojection_px: 0.5      # GEOMETRY_INCONSISTENT above this
  seed_radius_px: 40     # SIFT matches within this radius give a POI's local affine guess
temporal:
  shape_order: 1
  initialization: previous_solution
  frame_batch: 64
quality:
  fb_stride: 50          # forward-backward spot check every N frames (0 = off)
storage:
  save_params: false
