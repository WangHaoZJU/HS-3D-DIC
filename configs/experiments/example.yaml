# Example experiment configuration. One file per test run, tracked in git.
name: example
description: Template experiment; copy and edit.

cameras:
  left:
    path: example/left        # relative to data_root
    pattern: "*.tif"
  right:
    path: example/right
    pattern: "*.tif"
  frame_rate_hz: 10000.0

# Optional crop in full-sensor pixel coordinates: [x0, y0, width, height]
roi: null

frames:
  start: 0
  stop: null                  # exclusive; null = to the end
  step: 1
reference_frame: 0

calibration_file: example/calibration.h5   # relative to data_root; written by scripts/calibrate.py

# Optional: how to compute calibration_file (scripts/calibrate.py)
calibration:
  board:
    squares_x: 9
    squares_y: 7
    square_mm: 5.0
    marker_mm: 3.75
    dictionary: DICT_5X5_100
  left:
    path: example/calib/left
    pattern: "*.tif"
  right:
    path: example/calib/right
    pattern: "*.tif"
  distortion: k1k2p1p2        # k1k2p1p2 | k1k2p1p2k3 | rational
  refine_stereo_intrinsics: true
output_file: example.h5                    # relative to results_root

# Any key from configs/defaults/dic.yaml can be overridden here, e.g.:
dic:
  poi:
    subset_size: 31
