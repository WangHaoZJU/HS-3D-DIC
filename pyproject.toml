[project]
name = "stereodic"
version = "0.0.1"
description = "High-speed stereo DIC for full-field 3D blade vibration measurement"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "numba>=0.60",
    "opencv-python-headless>=4.10",
    "h5py>=3.11",
    "tifffile>=2024.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# GPU backend: Linux + NVIDIA only (`uv sync --extra cuda`)
cuda = ["cupy-cuda12x>=13.3; sys_platform == 'linux'"]
# 3D visualization / mode-shape animation
viz = ["pyvista>=0.44"]

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stereodic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = [
    "cuda: requires CuPy and an NVIDIA GPU (auto-skipped otherwise)",
    "slow: long-running test, excluded by default (run with -m slow)",
]
